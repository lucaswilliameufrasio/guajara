[package]
name = "guajara"
version = "0.2.0"
edition = "2024"
repository = "https://github.com/lucaswilliameufrasio/guajara"

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.27.0"

[profile.dist]
inherits = "release"
lto = "thin"
